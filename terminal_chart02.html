<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Terminal · Lista y Gráfico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              dark: '#090b0f',
              cardDark: '#10141c',
              borderDark: '#1e2533',
              light: '#f8fafc',
              cardLight: '#ffffff',
              borderLight: '#e2e8f0'
            }
          }
        }
      }
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    .chart-shell {
      height: calc(100dvh - 3.5rem);
      min-height: 320px;
      width: 100%;
      position: relative;
    }
    #tv_chart_wrapper,
    #tv_chart_wrapper > div,
    #tv_chart_wrapper iframe {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
  </style>
</head>
<body class="bg-surface-light text-slate-900 dark:bg-surface-dark dark:text-slate-100 antialiased selection:bg-sky-500/30">
  <div class="min-h-[100dvh] flex flex-col">
    <!-- Barra superior minimalista -->
    <header class="h-14 shrink-0 border-b border-surface-borderLight dark:border-surface-borderDark bg-surface-cardLight/95 dark:bg-surface-cardDark/95 backdrop-blur px-3 sm:px-5 flex items-center justify-between gap-2 z-20">
      <div class="flex items-center gap-2 pl-12 sm:pl-0">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="font-semibold tracking-tight text-sm hidden sm:inline">TERMINAL</span>
        <div class="flex items-center rounded-lg bg-slate-100 dark:bg-slate-900 p-0.5 border border-surface-borderLight dark:border-surface-borderDark">
          <button
            id="tab-list"
            type="button"
            class="px-3 py-1 rounded-md text-xs font-medium transition flex items-center gap-1.5 bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs"
          >
            <span>Lista</span>
            <span id="list-count" class="text-[11px] px-1.5 py-0.2 rounded bg-slate-200/80 dark:bg-slate-700 text-slate-700 dark:text-slate-200">0</span>
          </button>
          <button
            id="tab-chart"
            type="button"
            class="px-3 py-1 rounded-md text-xs font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"
          >
            Gráfico
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="open-ticker-modal"
          type="button"
          class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-surface-borderLight dark:border-surface-borderDark bg-white dark:bg-slate-900 hover:border-sky-500/60 transition flex items-center gap-1"
        >
          <span>+ Ticker</span>
        </button>
        <button
          id="theme-toggle"
          type="button"
          aria-label="Cambiar tema"
          class="w-8 h-8 rounded-lg border border-surface-borderLight dark:border-surface-borderDark bg-white dark:bg-slate-900 hover:border-sky-500/60 transition flex items-center justify-center text-sm"
        >
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <!-- Pestaña 1: Lista adaptable -->
    <main id="view-list" class="flex-1 p-3 sm:p-5 max-w-7xl w-full mx-auto space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div id="category-filters" class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar"></div>
        <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
          <span id="active-symbol-badge" class="font-mono px-2 py-1 rounded bg-slate-100 dark:bg-slate-900 border border-surface-borderLight dark:border-surface-borderDark"></span>
          <button
            id="reset-list-btn"
            type="button"
            class="px-2 py-1 rounded border border-surface-borderLight dark:border-surface-borderDark hover:bg-slate-100 dark:hover:bg-slate-800 transition"
          >
            Restaurar
          </button>
        </div>
      </div>

      <div id="watchlist-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2.5"></div>
    </main>

    <!-- Pestaña 2: Gráfico a pantalla completa hasta abajo -->
    <section id="view-chart" class="hidden flex-1 w-full">
      <div class="chart-shell">
        <div id="tv_chart_wrapper"></div>
      </div>
    </section>
  </div>

  <!-- Modal buscador / constructor de Tickers -->
  <div id="ticker-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-xs p-3 sm:p-6 flex items-center justify-center">
    <div class="w-full max-w-xl rounded-2xl border border-surface-borderLight dark:border-surface-borderDark bg-surface-cardLight dark:bg-surface-cardDark shadow-2xl overflow-hidden flex flex-col max-h-[88dvh]">
      <div class="px-4 py-3 border-b border-surface-borderLight dark:border-surface-borderDark flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold">Añadir o buscar Ticker</h2>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Busca en el catálogo rápido o escribe un símbolo de TradingView (ej. NASDAQ:AAPL)</p>
        </div>
        <button id="close-ticker-modal" type="button" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-sm">✕</button>
      </div>

      <div class="p-4 space-y-3 border-b border-surface-borderLight dark:border-surface-borderDark">
        <input
          id="ticker-search-input"
          type="text"
          placeholder="Buscar nombre, país o ticker (ej. Nvidia, Oro, Iberdrola, SOL, DAX)..."
          class="w-full px-3 py-2 rounded-lg text-sm border border-surface-borderLight dark:border-surface-borderDark bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500"
        />
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input
            id="custom-symbol-input"
            type="text"
            placeholder="Símbolo (ej. BME:SAN)"
            class="px-3 py-1.5 rounded-lg text-xs font-mono border border-surface-borderLight dark:border-surface-borderDark bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
          <input
            id="custom-name-input"
            type="text"
            placeholder="Nombre (opcional)"
            class="px-3 py-1.5 rounded-lg text-xs border border-surface-borderLight dark:border-surface-borderDark bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
          <select
            id="custom-cat-select"
            class="px-2.5 py-1.5 rounded-lg text-xs border border-surface-borderLight dark:border-surface-borderDark bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500"
          >
            <option value="Índices">Índices</option>
            <option value="Metales">Metales</option>
            <option value="Cripto">Cripto</option>
            <option value="EE. UU.">EE. UU.</option>
            <option value="Francia">Francia</option>
            <option value="Alemania">Alemania</option>
            <option value="España">España</option>
            <option value="Italia">Italia</option>
          </select>
        </div>
        <button
          id="add-custom-ticker-btn"
          type="button"
          class="w-full py-2 rounded-lg text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white transition"
        >
          Añadir símbolo personalizado a la lista
        </button>
      </div>

      <div id="catalog-results" class="p-3 overflow-y-auto space-y-1.5 flex-1"></div>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>

      // 5 valores más líquidos Italia
      { symbol: 'MIL:ISP', name: 'Intesa Sanpaolo', category: 'Italia', price: 3.92, changePct: 0.48 },
      { symbol: 'MIL:UCG', name: 'UniCredit', category: 'Italia', price: 38.45, changePct: 0.93 },
      { symbol: 'MIL:ENEL', name: 'Enel', category: 'Italia', price: 6.84, changePct: 0.15 },
      { symbol: 'MIL:ENI', name: 'Eni', category: 'Italia', price: 13.96, changePct: -0.28 },
      { symbol: 'MIL:RACE', name: 'Ferrari', category: 'Italia', price: 426.00, changePct: 0.77 }
    ];

    const EXTRA_CATALOG = [
      { symbol: 'NASDAQ:META', name: 'Meta Platforms', category: 'EE. UU.', price: 584.10, changePct: 1.12 },
      { symbol: 'NASDAQ:GOOGL', name: 'Alphabet', category: 'EE. UU.', price: 178.45, changePct: 0.65 },
      { symbol: 'BINANCE:ADAUSDT', name: 'Cardano', category: 'Cripto', price: 0.82, changePct: 1.90 },
      { symbol: 'BINANCE:DOGEUSDT', name: 'Dogecoin', category: 'Cripto', price: 0.39, changePct: -0.75 },
      { symbol: 'TVC:USOIL', name: 'Petróleo WTI', category: 'Índices', price: 69.85, changePct: 0.42 },
      { symbol: 'BME:TEF', name: 'Telefónica', category: 'España', price: 4.32, changePct: -0.15 },
      { symbol: 'XETR:MBG', name: 'Mercedes-Benz', category: 'Alemania', price: 54.90, changePct: -0.46 },
      { symbol: 'EURONEXT:RMS', name: 'Hermès', category: 'Francia', price: 2140.00, changePct: 0.31 },
      { symbol: 'MIL:STLAM', name: 'Stellantis', category: 'Italia', price: 12.68, changePct: -0.52 }
    ];

    const CATEGORIES = ['Todos', 'Índices', 'Metales', 'Cripto', 'EE. UU.', 'Francia', 'Alemania', 'España', 'Italia'];

    let items = loadItems();
    let activeSymbol = localStorage.getItem(STORAGE_KEYS.activeSymbol) || (items[0] ? items[0].symbol : 'BINANCE:BTCUSDT');
    let activeCategory = 'Todos';
    let currentTab = 'list';
    let tvWidget = null;

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.items);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (_) {}
      return DEFAULT_ITEMS.map((x) => ({ ...x }));
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEYS.items, JSON.stringify(items));
    }

    function getTheme() {
      const saved = localStorage.getItem(STORAGE_KEYS.theme);
      if (saved === 'light' || saved === 'dark') return saved;
      return 'dark';
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (theme === 'dark') {
        root.classList.add('dark');
        icon.textContent = '☀️';
      } else {
        root.classList.remove('dark');
        icon.textContent = '🌙';
      }
      localStorage.setItem(STORAGE_KEYS.theme, theme);
      if (currentTab === 'chart') {
        renderChart(activeSymbol);
      }
    }

    function formatPrice(val) {
      if (typeof val !== 'number' || Number.isNaN(val)) return '—';
      if (val >= 1000) return val.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (val >= 10) return val.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return val.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }

    function renderCategories() {
      const container = document.getElementById('category-filters');
      container.innerHTML = '';
      CATEGORIES.forEach((cat) => {
        const count = cat === 'Todos' ? items.length : items.filter((i) => i.category === cat).length;
        const btn = document.createElement('button');
        btn.type = 'button';
        const selected = activeCategory === cat;
        btn.className = `px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap border transition ${
          selected
            ? 'bg-sky-600 text-white border-sky-600'
            : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-surface-borderLight dark:border-surface-borderDark hover:border-sky-500/50'
        }`;
        btn.textContent = `${cat} (${count})`;
        btn.addEventListener('click', () => {
          activeCategory = cat;
          renderCategories();
          renderWatchlist();
        });
        container.appendChild(btn);
      });
    }

    function renderWatchlist() {
      const grid = document.getElementById('watchlist-grid');
      const countBadge = document.getElementById('list-count');
      const activeBadge = document.getElementById('active-symbol-badge');

      countBadge.textContent = String(items.length);
      activeBadge.textContent = activeSymbol;

      const filtered = activeCategory === 'Todos'
        ? items
        : items.filter((item) => item.category === activeCategory);

      grid.innerHTML = '';
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full rounded-xl border border-dashed border-surface-borderLight dark:border-surface-borderDark p-8 text-center text-xs text-slate-500 dark:text-slate-400">
            No hay valores en esta categoría. Usa <strong>+ Ticker</strong> para añadir uno.
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const isPositive = Number(item.changePct) >= 0;
        const isSelected = item.symbol === activeSymbol;
        const card = document.createElement('div');
        card.className = `group rounded-xl border p-3 transition cursor-pointer flex items-center justify-between gap-2 ${
          isSelected
            ? 'border-sky-500 bg-sky-500/5 dark:bg-sky-500/10'
            : 'border-surface-borderLight dark:border-surface-borderDark bg-surface-cardLight dark:bg-surface-cardDark hover:border-slate-400 dark:hover:border-slate-600'
        }`;

        card.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <span class="font-semibold text-sm truncate">${item.name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 shrink-0">${item.category}</span>
            </div>
            <div class="font-mono text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${item.symbol}</div>
          </div>

          <div class="text-right shrink-0">
            <div class="font-mono text-sm font-semibold">${formatPrice(item.price)}</div>
            <div class="font-mono text-xs font-medium ${isPositive ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
              ${isPositive ? '+' : ''}${Number(item.changePct).toFixed(2)}%
            </div>
          </div>

          <button
            type="button"
            title="Quitar de la lista"
            aria-label="Quitar ${item.name}"
            class="delete-btn ml-1 w-7 h-7 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 flex items-center justify-center text-xs transition shrink-0"
          >
            ✕
          </button>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.delete-btn')) return;
          activeSymbol = item.symbol;
          localStorage.setItem(STORAGE_KEYS.activeSymbol, activeSymbol);
          renderWatchlist();
          switchTab('chart');
        });

        card.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          items = items.filter((x) => !(x.symbol === item.symbol && x.name === item.name));
          if (activeSymbol === item.symbol) {
            activeSymbol = items[0] ? items[0].symbol : 'BINANCE:BTCUSDT';
            localStorage.setItem(STORAGE_KEYS.activeSymbol, activeSymbol);
          }
          saveItems();
          renderCategories();
          renderWatchlist();
        });

        grid.appendChild(card);
      });
    }

    function syncChartHeight() {
      const shell = document.querySelector('.chart-shell');
      if (!shell) return;
      const topOffset = shell.getBoundingClientRect().top;
      const available = Math.max(320, window.innerHeight - topOffset);
      shell.style.height = `${available}px`;
    }

    function renderChart(symbol) {
      syncChartHeight();
      const wrapper = document.getElementById('tv_chart_wrapper');
      wrapper.innerHTML = '';

      if (typeof TradingView === 'undefined' || !TradingView.widget) {
        wrapper.innerHTML = '<div class="h-full flex items-center justify-center text-xs text-slate-500">Cargando gráfico de TradingView...</div>';
        return;
      }

      const isDark = document.documentElement.classList.contains('dark');
      const containerId = `tv_${Date.now()}`;
      const innerDiv = document.createElement('div');
      innerDiv.id = containerId;
      wrapper.appendChild(innerDiv);

      tvWidget = new TradingView.widget({
        container_id: containerId,
        symbol: symbol,
        interval: 'D',
        timezone: 'Europe/Madrid',
        theme: isDark ? 'dark' : 'light',
        style: '1',
        locale: 'es',
        toolbar_bg: isDark ? '#090b0f' : '#f8fafc',
        enable_publishing: false,
        allow_symbol_change: true,
        save_image: false,
        autosize: true,
        hide_side_toolbar: false,
        studies: [],
        withdateranges: true
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      const viewList = document.getElementById('view-list');
      const viewChart = document.getElementById('view-chart');
      const tabList = document.getElementById('tab-list');
      const tabChart = document.getElementById('tab-chart');

      if (tab === 'chart') {
        viewList.classList.add('hidden');
        viewChart.classList.remove('hidden');

        tabChart.className = 'px-3 py-1 rounded-md text-xs font-medium transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs';
        tabList.className = 'px-3 py-1 rounded-md text-xs font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';

        renderChart(activeSymbol);
      } else {
        viewChart.classList.add('hidden');
        viewList.classList.remove('hidden');

        tabList.className = 'px-3 py-1 rounded-md text-xs font-medium transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs';
        tabChart.className = 'px-3 py-1 rounded-md text-xs font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';

        renderWatchlist();
      }
    }

    function renderCatalog(filterText = '') {
      const resultsEl = document.getElementById('catalog-results');
      const q = filterText.trim().toLowerCase();

      const combined = [...DEFAULT_ITEMS, ...EXTRA_CATALOG].filter((entry, idx, arr) =>
        arr.findIndex((x) => x.symbol === entry.symbol) === idx
      );

      const matches = q
        ? combined.filter(
            (c) =>
              c.name.toLowerCase().includes(q) ||
              c.symbol.toLowerCase().includes(q) ||
              c.category.toLowerCase().includes(q)
          )
        : combined.slice(0, 18);

      resultsEl.innerHTML = '';
      if (matches.length === 0) {
        resultsEl.innerHTML = '<div class="text-xs text-slate-500 py-4 text-center">Sin coincidencias en el catálogo. Usa el campo de símbolo personalizado arriba.</div>';
        return;
      }

      matches.forEach((entry) => {
        const exists = items.some((i) => i.symbol === entry.symbol);
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-2 px-3 py-2 rounded-xl border border-surface-borderLight dark:border-surface-borderDark bg-slate-50/70 dark:bg-slate-900/60';
        row.innerHTML = `
          <div class="min-w-0">
            <div class="text-xs font-semibold truncate">${entry.name} <span class="font-normal text-slate-400">· ${entry.category}</span></div>
            <div class="text-[11px] font-mono text-slate-500 dark:text-slate-400 truncate">${entry.symbol}</div>
          </div>
          <button
            type="button"
            class="px-2.5 py-1 rounded-lg text-xs font-medium shrink-0 transition ${
              exists
                ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'
                : 'bg-sky-600 hover:bg-sky-500 text-white'
            }"
          >
            ${exists ? 'En lista' : '+ Añadir'}
          </button>
        `;

        row.querySelector('button').addEventListener('click', () => {
          if (!exists) {
            items.unshift({ ...entry });
            saveItems();
            renderCategories();
            renderWatchlist();
          }
          activeSymbol = entry.symbol;
          localStorage.setItem(STORAGE_KEYS.activeSymbol, activeSymbol);
          closeModal();
          switchTab('chart');
        });

        resultsEl.appendChild(row);
      });
    }

    function openModal() {
      document.getElementById('ticker-modal').classList.remove('hidden');
      document.getElementById('ticker-search-input').value = '';
      renderCatalog('');
      setTimeout(() => document.getElementById('ticker-search-input').focus(), 50);
    }

    function closeModal() {
      document.getElementById('ticker-modal').classList.add('hidden');
    }

    document.getElementById('tab-list').addEventListener('click', () => switchTab('list'));
    document.getElementById('tab-chart').addEventListener('click', () => switchTab('chart'));
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(next);
    });
    document.getElementById('open-ticker-modal').addEventListener('click', openModal);
    document.getElementById('close-ticker-modal').addEventListener('click', closeModal);
    document.getElementById('ticker-modal').addEventListener('click', (e) => {
      if (e.target.id === 'ticker-modal') closeModal();
    });
    document.getElementById('ticker-search-input').addEventListener('input', (e) => {
      renderCatalog(e.target.value);
    });

    document.getElementById('add-custom-ticker-btn').addEventListener('click', () => {
      const rawSym = document.getElementById('custom-symbol-input').value.trim().toUpperCase();
      const rawName = document.getElementById('custom-name-input').value.trim();
      const cat = document.getElementById('custom-cat-select').value;

      if (!rawSym) return;
      const symbol = rawSym;
      const name = rawName || (symbol.includes(':') ? symbol.split(':')[1] : symbol);

      items.unshift({
        symbol,
        name,
        category: cat,
        price: 100.00,
        changePct: 0.00
      });
      activeSymbol = symbol;
      localStorage.setItem(STORAGE_KEYS.activeSymbol, activeSymbol);
      saveItems();

      document.getElementById('custom-symbol-input').value = '';
      document.getElementById('custom-name-input').value = '';
      renderCategories();
      renderWatchlist();
      closeModal();
      switchTab('chart');
    });

    document.getElementById('reset-list-btn').addEventListener('click', () => {
      items = DEFAULT_ITEMS.map((x) => ({ ...x }));
      activeSymbol = items[0].symbol;
      localStorage.setItem(STORAGE_KEYS.activeSymbol, activeSymbol);
      saveItems();
      renderCategories();
      renderWatchlist();
    });

    window.addEventListener('resize', () => {
      if (currentTab === 'chart') {
        syncChartHeight();
      }
    });

    // Inicialización
    applyTheme(getTheme());
    renderCategories();
    renderWatchlist();
  </script>
</body>
</html>
